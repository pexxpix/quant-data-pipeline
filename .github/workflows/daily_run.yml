name: Daily Stock Scraper

on:
  schedule:
    # Chạy lúc 10:15 UTC (tức 17:15 VN) từ Thứ 2 đến Thứ 6
    - cron: '15 10 * * 1-5'
  workflow_dispatch: # Cho phép bấm chạy thủ công

jobs:
  run-bot:
    runs-on: ubuntu-latest

    # Quyền cần để đăng trang biểu đồ lên GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Lấy code về máy chủ ảo
      uses: actions/checkout@v4

    - name: Cài đặt Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Cài đặt thư viện
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Chạy script cào dữ liệu
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: python scraper.py

    - name: Tính chỉ báo RSI, MFI, CMF
      # Vẫn chạy khi bước cào lỗi một vài mã, để các mã còn lại có chỉ báo mới
      if: ${{ !cancelled() }}
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: python indicators.py

    - name: Vẽ biểu đồ
      id: charts
      if: ${{ !cancelled() }}
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: python charts.py

    - name: Chuẩn bị trang biểu đồ
      if: ${{ !cancelled() && steps.charts.outcome == 'success' }}
      uses: actions/upload-pages-artifact@v4
      with:
        path: site

    - name: Đăng lên GitHub Pages
      id: deployment
      if: ${{ !cancelled() && steps.charts.outcome == 'success' }}
      uses: actions/deploy-pages@v4
