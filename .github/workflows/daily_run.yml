name: Daily Stock Scraper

on:
  schedule:
    # Chạy lúc 10:15 UTC (tức 17:15 VN) từ Thứ 2 đến Thứ 6
    - cron: '15 10 * * 1-5'
  workflow_dispatch: # Cho phép bấm chạy thủ công

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Lấy code về máy chủ ảo
      uses: actions/checkout@v4

    - name: Cài đặt Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Cài đặt thư viện
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Chạy script cào dữ liệu
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: python scraper.py
